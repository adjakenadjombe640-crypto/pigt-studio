<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIGT STUDIO</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-6 text-center">
<h1 class="text-3xl font-black text-cyan-400 mt-10">⭐ PIGT STUDIO</h1>
<p class="text-slate-400 mt-2">Ton usine à applications est prête Boss</p>
<div class="max-w-xl mx-auto bg-zinc-900 rounded-2xl p-6 mt-8 text-left">
<textarea id="p" class="w-full h-32 bg-black border border-zinc-700 rounded-xl p-4 text-white" placeholder="Quelle appli veux-tu créer?"></textarea>
<button onclick="document.getElementById('r').innerHTML='✅ App créée: '+document.getElementById('p').value" class="w-full bg-cyan-400 text-black font-black py-3 rounded-xl mt-4">CRÉER</button>
<div id="r" class="mt-4 text-green-400 font-bold"></div>
</div>
</body>
</html>
